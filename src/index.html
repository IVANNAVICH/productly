<!DOCTYPE html>
<html>
  <head>
    <title>Productly</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <nav class="navbar">
        <div class="navbar__logo">
          <img src="i/logo.png" alt="logo" />
        </div>
        <ul class="navbar__menu">
          <li class="navbar__menu__item">
            <a href="#">Product</a>
          </li>
          <li class="navbar__menu__item">
            <a href="#">Customers</a>
          </li>
          <li class="navbar__menu__item">
            <a href="#">Pricing</a>
          </li>
          <li class="navbar__menu__item">
            <a href="#">Resources</a>
          </li>
        </ul>
        <div class="navbar__button-container">
          <button type="button" class="navbar__sign">Sign In</button>
          <button type="button" class="navbar__sign orange-btn">Sign Up</button>
        </div>
      </nav>

      <div id="darkToggle" class="btn-theme-container">
        <svg
          class="toggle-svg-btn"
          xmlns="http://www.w3.org/2000/svg"
          height="35px"
          viewBox="0 0 24 24"
          width="35px"
          fill="#242424"
        >
          <path d="M0 0h24v24H0z" fill="none" />
          <path
            id="svgPath"
            d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"
            fill="#242424"
          />
        </svg>
        <span class="btn-theme-container__span">Theme</span>
      </div>

      <header class="header">
        <div class="header__text-block">
          <h1 class="header__h1">The Design Thinking superpowers</h1>
          <p class="header__p">
            Tools, tutorials, design and innovation experts, all in one place!
            The most intuitive way to imagine your next user experience.
          </p>
          <button type="button" class="header__button orange-btn">
            Get Started
          </button>
        </div>
        <div class="header__img-block">
          <img src="i/header.svg" alt="header" />
        </div>
      </header>

      <main>
        <!-- Main content -->
      </main>

      <footer>
        <!-- Footer content -->
      </footer>
    </div>

    <!--  JavaScript here -->
    <!-- <script src="js/app.js"></script> -->
    <script src="js/script.js"></script>
  </body>
</html>
